services:
  airflow:
    image: apache/airflow:2.7.0-python3.11
    container_name: airflow
    user: "${AIRFLOW_UID:-50000}:0"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/sqlite/airflow.db
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"

      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID}
      GCS_BUCKET: ${GCS_BUCKET}

      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_PORT: 587
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_MAIL_FROM}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_APP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM}

      GUNICORN_CMD_ARGS: "--pid /tmp/airflow-webserver.pid"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./sqlite:/opt/airflow/sqlite
      - ~/.config/gcloud:/home/airflow/.config/gcloud:ro

    ports:
      - "8080:8080"

    command: >
      bash -euc "
        mkdir -p /opt/airflow/sqlite /opt/airflow/logs;
        airflow db migrate || airflow db init;
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true;
        airflow scheduler & exec airflow webserver
      "
